# Releases new theme versions and deploys the theme page to GitHub Pages.
#
# On every push to main, each packaged theme whose version has no release yet
# gets one (tagged <Dir>-v<version>, with <Dir>.zip and <Dir>-source.zip), and
# the page is rebuilt to link to the release files. Every six hours it runs
# again so the download counts baked into the page and themes.json stay fresh;
# the page also fetches live counts when it's opened.
#
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Publish themes

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # create releases
  pages: write      # deploy the page
  id-token: write

# One run at a time, so two pushes close together can't both create a release.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The themes built into Songo, which the page lists without downloads.
      - name: Check out Songo's built-in themes
        uses: actions/checkout@v4
        with:
          repository: Songo-Player/Songo-5
          path: .songo5
          sparse-checkout: internal_themes
          filter: blob:none

      - name: Release new theme versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 publish_releases.py
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          --out "$RUNNER_TEMP/releases.json"

      - name: Build the page
        run: >
          python3 build_theme_site.py
          --out _site
          --internal .songo5/internal_themes
          --releases "$RUNNER_TEMP/releases.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
